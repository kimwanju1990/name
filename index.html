<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>폐교의 칠판 - 어둠 속의 탐색</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&family=Single+Day&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Gaegu', cursive, sans-serif;
            user-select: none;
            touch-action: none;
        }

        .chalk-text {
            font-family: 'Gaegu', cursive;
            color: #e2f1e8;
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.6), 0 0 5px rgba(200, 240, 220, 0.3);
            letter-spacing: 1px;
        }

        .chalk-title {
            font-family: 'Single Day', cursive;
        }

        /* Creepy vignette and noise filter */
        .scary-overlay {
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.95);
        }

        /* CRT / Glitch static effect */
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            52% { opacity: 0.88; }
            54% { opacity: 1; }
            80% { opacity: 0.95; }
            100% { opacity: 0.98; }
        }

        .flashlight-active {
            animation: flicker 0.15s infinite;
        }

        /* Custom scrollbar for log modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(20, 20, 20, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-black text-gray-200 select-none overflow-hidden relative">

    <!-- Main Classroom Canvas -->
    <div id="game-container" class="relative w-full h-full flex items-center justify-center bg-black">
        <!-- Canvas for Classroom / Blackboard Scene -->
        <canvas id="sceneCanvas" class="absolute top-0 left-0 w-full h-full z-0"></canvas>
        
        <!-- Canvas for Dark Overlay & Flashlight Beam Effect -->
        <canvas id="flashlightCanvas" class="absolute top-0 left-0 w-full h-full z-10 pointer-events-none"></canvas>

        <!-- UI Controls Header -->
        <div class="absolute top-4 left-4 right-4 z-20 flex flex-wrap justify-between items-center gap-2 pointer-events-auto">
            <div class="bg-black/80 border border-red-900/60 backdrop-blur-md px-4 py-2 rounded-lg shadow-2xl text-red-500 font-bold flex items-center gap-3 text-lg sm:text-xl">
                <span class="inline-block w-3 h-3 rounded-full bg-red-600 animate-ping"></span>
                <span>폐교 1학년 2반 교실</span>
            </div>

            <div class="flex items-center gap-3">
                <!-- Flashlight Button (Initially OFF) -->
                <button id="flashToggleBtn" class="bg-gray-900/80 hover:bg-gray-800 text-gray-400 border border-gray-700 px-4 py-2 rounded-lg font-bold text-base sm:text-lg transition shadow-lg flex items-center gap-2 active:scale-95">
                    <svg id="flashIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M9 2h6v3H9zm0 5h6v3l-2 3v7h-2v-7L9 10z"/>
                    </svg>
                    <span id="flashStatusText">플래쉬 OFF</span>
                </button>

                <!-- Check / Solve Button -->
                <button id="confirmBtn" class="bg-emerald-900/90 hover:bg-emerald-800 text-emerald-100 border border-emerald-500/60 px-5 py-2 rounded-lg font-bold text-base sm:text-lg transition shadow-xl flex items-center gap-2 active:scale-95">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                    <span>확인 완료</span>
                </button>
            </div>
        </div>

        <!-- Hint Banner overlay at bottom -->
        <div id="hintBanner" class="absolute bottom-5 z-20 pointer-events-none bg-black/80 border border-gray-700 text-gray-300 text-sm sm:text-base px-6 py-2.5 rounded-full shadow-2xl backdrop-blur-sm text-center max-w-[90%] transition-opacity duration-500">
            🔦 마우스나 터치로 화면을 비추어 칠판에 적힌 단서들을 찾아보세요.
        </div>
    </div>

    <!-- Answer Verification Modal Dialog ("확인 완료" Modal) -->
    <div id="quizModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4">
        <div class="bg-zinc-900 border-2 border-red-950 text-gray-200 rounded-xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold p-1">✕</button>

            <div class="flex items-center gap-3 border-b border-zinc-800 pb-3 mb-4">
                <span class="text-3xl">🕵️️‍♂️</span>
                <div>
                    <h2 class="text-2xl font-bold text-amber-500 font-serif">칠판 정보 조사 보고서</h2>
                    <p class="text-xs text-gray-400">어둠 속 칠판에서 찾아낸 정답을 입력하고 [조사 완료]를 누르세요.</p>
                </div>
            </div>

            <form id="quizForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Q1 -->
                    <div class="bg-zinc-950 p-3.5 rounded-lg border border-zinc-800">
                        <label class="block text-sm font-semibold text-amber-300 mb-1">1. 날짜의 날씨는?</label>
                        <input type="text" id="q_weather" placeholder="예: 맑음" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- Q2 -->
                    <div class="bg-zinc-950 p-3.5 rounded-lg border border-zinc-800">
                        <label class="block text-sm font-semibold text-amber-300 mb-1">2. 오늘 반장의 이름은?</label>
                        <input type="text" id="q_president" placeholder="이름 입력" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- Q3 -->
                    <div class="bg-zinc-950 p-3.5 rounded-lg border border-zinc-800">
                        <label class="block text-sm font-semibold text-amber-300 mb-1">3. 학급 총 정원은 몇 명인가?</label>
                        <input type="text" id="q_total" placeholder="숫자만 입력 (예: 7)" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- Q4 -->
                    <div class="bg-zinc-950 p-3.5 rounded-lg border border-zinc-800">
                        <label class="block text-sm font-semibold text-amber-300 mb-1">4. 결석한 학생의 이름은?</label>
                        <input type="text" id="q_absent" placeholder="이름 입력" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- Q5 -->
                    <div class="bg-zinc-950 p-3.5 rounded-lg border border-zinc-800">
                        <label class="block text-sm font-semibold text-amber-300 mb-1">5. 수요일 3교시 과목은?</label>
                        <input type="text" id="q_wed3" placeholder="과목 입력" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- Q6 -->
                    <div class="bg-zinc-950 p-3.5 rounded-lg border border-zinc-800">
                        <label class="block text-sm font-semibold text-amber-300 mb-1">6. 목요일 2교시 과목은?</label>
                        <input type="text" id="q_thu2" placeholder="과목 입력" class="w-full bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- Result Message -->
                <div id="quizResult" class="hidden p-3 rounded-lg text-center font-bold text-sm"></div>

                <div class="flex justify-end gap-3 pt-3 border-t border-zinc-800">
                    <button type="button" id="modalCancelBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-gray-300 rounded-lg text-sm font-semibold">닫기</button>
                    <button type="submit" class="px-6 py-2 bg-red-800 hover:bg-red-700 text-white rounded-lg text-sm font-bold shadow-lg transition">조사 제출</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Canvas setup
        const sceneCanvas = document.getElementById('sceneCanvas');
        const sceneCtx = sceneCanvas.getContext('2d');
        const flashlightCanvas = document.getElementById('flashlightCanvas');
        const flashCtx = flashlightCanvas.getContext('2d');

        // State variables (Initially Flashlight OFF)
        let width = window.innerWidth;
        let height = window.innerHeight;
        let isFlashlightOn = false;
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;
        let flickerAlpha = 1.0;

        // Dust particles floating in flashlight beam
        const dustParticles = Array.from({ length: 45 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            size: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.7 + 0.3
        }));

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            sceneCanvas.width = width;
            sceneCanvas.height = height;
            flashlightCanvas.width = width;
            flashlightCanvas.height = height;
            renderScene();
        }

        window.addEventListener('resize', resizeCanvas);

        function renderScene() {
            // 1. Draw Pitch Dark Abandoned Wall Background
            sceneCtx.fillStyle = '#0a0908'; // Pitch black dark wall color
            sceneCtx.fillRect(0, 0, width, height);

            // Wall texture / grime stains
            sceneCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            for (let i = 0; i < 80; i++) {
                const gx = (Math.sin(i * 123.4) * 0.5 + 0.5) * width;
                const gy = (Math.cos(i * 321.1) * 0.5 + 0.5) * height;
                const gr = (Math.sin(i) * 0.5 + 0.5) * 120 + 30;
                sceneCtx.beginPath();
                sceneCtx.arc(gx, gy, gr, 0, Math.PI * 2);
                sceneCtx.fill();
            }

            // Top Motto Frames ("바르고 슬기롭게 건강하게", "참되게 착하게 아름답게")
            const frameW = Math.min(220, width * 0.22);
            const frameH = 50;
            const frameY = Math.max(12, height * 0.04);

            drawMottoFrame(width * 0.2 - frameW / 2, frameY, frameW, frameH, "바르고 슬기롭게 건강하게");
            drawMottoFrame(width * 0.8 - frameW / 2, frameY, frameW, frameH, "참되게 착하게 아름답게");

            // 2. Blackboard Area Bounds Calculation (2x Horizontal Spread)
            const boardMarginX = Math.max(8, width * 0.02); // Minimal side margins for 2x wider board feel
            const boardTop = frameY + frameH + 12;
            const boardBottom = height - Math.max(20, height * 0.05);
            const boardWidth = width - (boardMarginX * 2);
            const boardHeight = boardBottom - boardTop;

            // Wooden Blackboard Outer Frame
            sceneCtx.fillStyle = '#22150e'; // Darker rotten wood frame
            sceneCtx.fillRect(boardMarginX - 10, boardTop - 10, boardWidth + 20, boardHeight + 20);

            // Inner Frame Shadow
            sceneCtx.fillStyle = '#0d0704';
            sceneCtx.fillRect(boardMarginX - 4, boardTop - 4, boardWidth + 8, boardHeight + 8);

            // Blackboard Surface (Very dark dusty green)
            const bgGrad = sceneCtx.createLinearGradient(boardMarginX, boardTop, boardMarginX + boardWidth, boardTop + boardHeight);
            bgGrad.addColorStop(0, '#0f2218');
            bgGrad.addColorStop(0.5, '#142a1e');
            bgGrad.addColorStop(1, '#0c1d14');
            sceneCtx.fillStyle = bgGrad;
            sceneCtx.fillRect(boardMarginX, boardTop, boardWidth, boardHeight);

            // Blackboard Chalk Smudges
            sceneCtx.fillStyle = 'rgba(255, 255, 255, 0.025)';
            for (let i = 0; i < 50; i++) {
                const cx = boardMarginX + Math.random() * boardWidth;
                const cy = boardTop + Math.random() * boardHeight;
                sceneCtx.beginPath();
                sceneCtx.arc(cx, cy, Math.random() * 90 + 30, 0, Math.PI * 2);
                sceneCtx.fill();
            }

            // 3. Chalk Text Writings (Spaced across wider chalkboard)
            // Top Right: "2010년 11월 1일 월요일 날씨: 맑음"
            const fontSizeDate = Math.max(16, Math.min(26, boardWidth * 0.022));
            sceneCtx.font = `700 ${fontSizeDate}px 'Gaegu', cursive`;
            sceneCtx.fillStyle = '#d8ebd8';
            sceneCtx.textAlign = 'right';
            sceneCtx.fillText("2010년 11월 1일 월요일 날씨: 맑음", boardMarginX + boardWidth - 40, boardTop + fontSizeDate + 25);

            // Bottom Left: Class Info (Updated: 조유나)
            const fontSizeInfo = Math.max(18, Math.min(30, boardWidth * 0.025));
            sceneCtx.font = `700 ${fontSizeInfo}px 'Gaegu', cursive`;
            sceneCtx.textAlign = 'left';
            const infoX = boardMarginX + 45;
            let infoY = boardTop + boardHeight - (fontSizeInfo * 3.8);

            sceneCtx.fillText("오늘 반장: 오유진", infoX, infoY);
            infoY += fontSizeInfo * 1.35;
            sceneCtx.fillText("정원 7명", infoX, infoY);
            infoY += fontSizeInfo * 1.35;
            sceneCtx.fillText("결석 1명(조유나)", infoX, infoY);

            // 4. Timetable Poster (한국고등학교 1학년 시간표) Attached at Bottom Right
            drawTimetablePoster(boardMarginX, boardTop, boardWidth, boardHeight);
        }

        function drawMottoFrame(x, y, w, h, text) {
            sceneCtx.fillStyle = '#2b211b';
            sceneCtx.fillRect(x, y, w, h);
            sceneCtx.strokeStyle = '#4a382c';
            sceneCtx.lineWidth = 3;
            sceneCtx.strokeRect(x + 2, y + 2, w - 4, h - 4);

            sceneCtx.fillStyle = '#dcd3be';
            sceneCtx.fillRect(x + 6, y + 6, w - 12, h - 12);

            sceneCtx.fillStyle = '#222';
            sceneCtx.font = `700 ${Math.max(11, Math.min(15, w * 0.08))}px 'Gaegu', cursive`;
            sceneCtx.textAlign = 'center';
            sceneCtx.textBaseline = 'middle';
            sceneCtx.fillText(text, x + w / 2, y + h / 2);
            sceneCtx.textBaseline = 'alphabetic'; // reset
        }

        function drawTimetablePoster(boardX, boardY, boardW, boardH) {
            // Positioned at bottom right of the blackboard
            const posterW = Math.max(280, Math.min(480, boardW * 0.44));
            const posterH = Math.max(210, Math.min(320, boardH * 0.58));
            const posterX = boardX + boardW - posterW - 25;
            const posterY = boardY + boardH - posterH - 25;

            // Paper Background (Off-white / aged paper look)
            sceneCtx.fillStyle = '#f4f0e6';
            sceneCtx.fillRect(posterX, posterY, posterW, posterH);

            // Tape or pin effect at corners
            sceneCtx.fillStyle = 'rgba(210, 190, 150, 0.7)';
            sceneCtx.fillRect(posterX + 10, posterY - 4, 25, 10);
            sceneCtx.fillRect(posterX + posterW - 35, posterY - 4, 25, 10);

            // Poster Header
            const headerFontSize = Math.max(14, posterW * 0.055);
            sceneCtx.fillStyle = '#111827';
            sceneCtx.font = `700 ${headerFontSize}px 'Single Day', cursive`;
            sceneCtx.textAlign = 'center';
            sceneCtx.fillText("한국고등학교 1학년 시간표", posterX + posterW / 2, posterY + headerFontSize + 8);

            // Table Grid setup
            const tableX = posterX + 10;
            const tableY = posterY + headerFontSize + 16;
            const tableW = posterW - 20;
            const tableH = posterY + posterH - tableY - 10;

            const cols = 6; // 교시, 월, 화, 수, 목, 금
            const rows = 8; // Header row, 1~4교시, 점심시간, 5~6교시
            const colW = tableW / cols;
            const rowH = tableH / rows;

            // Draw Grid Lines
            sceneCtx.strokeStyle = '#333333';
            sceneCtx.lineWidth = 1;
            sceneCtx.beginPath();

            for (let r = 0; r <= rows; r++) {
                sceneCtx.moveTo(tableX, tableY + r * rowH);
                sceneCtx.lineTo(tableX + tableW, tableY + r * rowH);
            }
            for (let c = 0; c <= cols; c++) {
                sceneCtx.moveTo(tableX + c * colW, tableY);
                sceneCtx.lineTo(tableX + c * colW, tableY + tableH);
            }
            sceneCtx.stroke();

            // Table Cell Headers
            const headers = ["교시", "월", "화", "수", "목", "금"];
            const fontTable = Math.max(10, Math.min(15, colW * 0.28));
            sceneCtx.font = `700 ${fontTable}px 'Gaegu', cursive`;

            // Draw Header Row
            headers.forEach((hText, i) => {
                sceneCtx.fillText(hText, tableX + i * colW + colW / 2, tableY + rowH * 0.65);
            });

            // Timetable Data Matrix
            const schedule = [
                // 1교시
                { period: "1교시\n(09:00~09:40)", subjects: ["국어", "수학", "영어", "수학", "국어"] },
                // 2교시
                { period: "2교시\n(09:50~10:30)", subjects: ["미술", "도덕", "체육", "기술", "수학"] },
                // 3교시
                { period: "3교시\n(10:40~11:20)", subjects: ["사회", "과학", "역사", "기가", "영어"] },
                // 4교시
                { period: "4교시\n(11:30~12:10)", subjects: ["영어", "기가", "음악", "실과", "미술"] },
                // 점심시간
                { period: "점심시간\n(12:10~13:10)", lunch: true },
                // 5교시
                { period: "5교시\n(13:10~13:50)", subjects: ["기술", "실과", "국어", "미술", "과학"] },
                // 6교시
                { period: "6교시\n(14:00~14:40)", subjects: ["체육", "자율", "CROSS", "한문", "체육"] }
            ];

            const subFontSize = Math.max(10, Math.min(16, colW * 0.32));
            const subFontSmall = Math.max(8, subFontSize * 0.65);

            schedule.forEach((row, rIdx) => {
                const currentY = tableY + (rIdx + 1) * rowH;

                // 1. Period Label
                sceneCtx.textAlign = 'center';
                sceneCtx.font = `700 ${subFontSmall}px sans-serif`;
                const lines = row.period.split('\n');
                sceneCtx.fillText(lines[0], tableX + colW / 2, currentY + rowH * 0.4);
                if (lines[1]) {
                    sceneCtx.fillText(lines[1], tableX + colW / 2, currentY + rowH * 0.75);
                }

                // 2. Lunch Row Special Handling
                if (row.lunch) {
                    sceneCtx.font = `700 ${subFontSize}px 'Gaegu', cursive`;
                    sceneCtx.fillText("🍚   점심시간   🥄", tableX + colW + (colW * 5) / 2, currentY + rowH * 0.65);
                    return;
                }

                // 3. Subject Cells
                row.subjects.forEach((subj, cIdx) => {
                    const cellX = tableX + (cIdx + 1) * colW;
                    if (subj === "CROSS") {
                        // Draw X cross mark on Wednesday 6th period
                        sceneCtx.beginPath();
                        sceneCtx.moveTo(cellX, currentY);
                        sceneCtx.lineTo(cellX + colW, currentY + rowH);
                        sceneCtx.moveTo(cellX + colW, currentY);
                        sceneCtx.lineTo(cellX, currentY + rowH);
                        sceneCtx.strokeStyle = '#555';
                        sceneCtx.stroke();
                    } else {
                        sceneCtx.font = `700 ${subFontSize}px 'Gaegu', cursive`;
                        sceneCtx.fillText(subj, cellX + colW / 2, currentY + rowH * 0.65);
                    }
                });
            });
        }

        function renderFlashlight() {
            // Smooth cursor movement
            mouseX += (targetMouseX - mouseX) * 0.2;
            mouseY += (targetMouseY - mouseY) * 0.2;

            flashCtx.clearRect(0, 0, width, height);

            if (!isFlashlightOn) {
                // Completely dark classroom
                flashCtx.fillStyle = 'rgba(0, 0, 0, 0.998)';
                flashCtx.fillRect(0, 0, width, height);
                return;
            }

            // Flashlight ON mode
            if (Math.random() < 0.05) {
                flickerAlpha = 0.80 + Math.random() * 0.2;
            } else {
                flickerAlpha = 0.98;
            }

            // Pitch darkness overlay
            flashCtx.fillStyle = `rgba(1, 2, 3, ${0.992 * flickerAlpha})`;
            flashCtx.fillRect(0, 0, width, height);

            // Carve out narrowed flashlight light beam circle
            flashCtx.save();
            flashCtx.globalCompositeOperation = 'destination-out';

            // Reduced beam radius for narrower spotlight feel
            const radius = Math.min(width, height) * 0.13;
            const grad = flashCtx.createRadialGradient(mouseX, mouseY, 5, mouseX, mouseY, radius);
            grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
            grad.addColorStop(0.6, 'rgba(0, 0, 0, 0.88)');
            grad.addColorStop(0.85, 'rgba(0, 0, 0, 0.35)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            flashCtx.fillStyle = grad;
            flashCtx.beginPath();
            flashCtx.arc(mouseX, mouseY, radius, 0, Math.PI * 2);
            flashCtx.fill();
            flashCtx.restore();

            // Add warm center beam glow
            flashCtx.save();
            flashCtx.globalCompositeOperation = 'source-over';
            const lightGlow = flashCtx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, radius);
            lightGlow.addColorStop(0, 'rgba(255, 245, 200, 0.18)');
            lightGlow.addColorStop(0.5, 'rgba(255, 230, 160, 0.05)');
            lightGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            flashCtx.fillStyle = lightGlow;
            flashCtx.beginPath();
            flashCtx.arc(mouseX, mouseY, radius, 0, Math.PI * 2);
            flashCtx.fill();

            // Dust particles inside beam
            dustParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                const dx = p.x - mouseX;
                const dy = p.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < radius) {
                    const opacity = (1 - dist / radius) * p.alpha;
                    flashCtx.fillStyle = `rgba(255, 255, 220, ${opacity})`;
                    flashCtx.beginPath();
                    flashCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    flashCtx.fill();
                }
            });

            flashCtx.restore();
        }

        function gameLoop() {
            renderFlashlight();
            requestAnimationFrame(gameLoop);
        }

        function updatePointerPos(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            targetMouseX = clientX;
            targetMouseY = clientY;
        }

        window.addEventListener('mousemove', updatePointerPos);
        window.addEventListener('touchmove', updatePointerPos, { passive: true });
        window.addEventListener('touchstart', updatePointerPos, { passive: true });

        const flashToggleBtn = document.getElementById('flashToggleBtn');
        const flashStatusText = document.getElementById('flashStatusText');

        flashToggleBtn.addEventListener('click', () => {
            isFlashlightOn = !isFlashlightOn;

            if (isFlashlightOn) {
                flashStatusText.innerText = '플래쉬 ON';
                flashToggleBtn.className = 'bg-amber-900/80 hover:bg-amber-800 text-amber-200 border border-amber-600/60 px-4 py-2 rounded-lg font-bold text-base sm:text-lg transition shadow-lg flex items-center gap-2 active:scale-95';
            } else {
                flashStatusText.innerText = '플래쉬 OFF';
                flashToggleBtn.className = 'bg-gray-900/80 hover:bg-gray-800 text-gray-400 border border-gray-700 px-4 py-2 rounded-lg font-bold text-base sm:text-lg transition shadow-lg flex items-center gap-2 active:scale-95';
            }
        });

        const confirmBtn = document.getElementById('confirmBtn');
        const quizModal = document.getElementById('quizModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const quizForm = document.getElementById('quizForm');
        const quizResult = document.getElementById('quizResult');

        confirmBtn.addEventListener('click', () => {
            quizModal.classList.remove('hidden');
            quizResult.classList.add('hidden');
        });

        function hideModal() {
            quizModal.classList.add('hidden');
        }

        closeModalBtn.addEventListener('click', hideModal);
        modalCancelBtn.addEventListener('click', hideModal);

        quizForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const answers = {
                weather: document.getElementById('q_weather').value.trim(),
                president: document.getElementById('q_president').value.trim(),
                total: document.getElementById('q_total').value.trim(),
                absent: document.getElementById('q_absent').value.trim(),
                wed3: document.getElementById('q_wed3').value.trim(),
                thu2: document.getElementById('q_thu2').value.trim()
            };

            let score = 0;
            const totalQuestions = 6;

            if (answers.weather.includes('맑음')) score++;
            if (answers.president.includes('오유진')) score++;
            if (answers.total.includes('7')) score++;
            if (answers.absent.includes('조유나')) score++;
            if (answers.wed3.includes('역사')) score++;
            if (answers.thu2.includes('기술')) score++;

            quizResult.classList.remove('hidden');

            if (score === totalQuestions) {
                quizResult.className = 'p-3 rounded-lg text-center font-bold text-sm bg-emerald-950/80 border border-emerald-600 text-emerald-300';
                quizResult.innerHTML = `🎉 Perfect! 모든 칠판 단서를 올바르게 찾아냈습니다! (6/6 정답)<br><span class="text-xs text-gray-300">폐교 1학년 2반 교실의 비밀 조사를 성공적으로 마쳤습니다.</span>`;
            } else {
                quizResult.className = 'p-3 rounded-lg text-center font-bold text-sm bg-red-950/80 border border-red-700 text-red-300';
                quizResult.innerHTML = `⚠️ 일부 단서가 일치하지 않습니다. (정답: ${score} / ${totalQuestions})<br><span class="text-xs text-gray-400">플래쉬로 넓어진 칠판 구석구석을 다시 비추어보세요.</span>`;
            }
        });

        // Hide hint banner after 7 seconds
        setTimeout(() => {
            const hint = document.getElementById('hintBanner');
            if (hint) hint.style.opacity = '0';
        }, 7000);

        window.onload = function() {
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
</html>
